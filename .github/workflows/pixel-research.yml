name: Pixel research APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      include_models:
        description: 'Export research-licensed MobileCLIP2 models and produce a complete APK'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: actions/setup-python@v5
        if: inputs.include_models
        with:
          python-version: '3.12'
      - name: Prepare validated research models
        if: inputs.include_models
        run: |
          python -m pip install torch==2.13.0+cpu torchvision==0.28.0+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/models/requirements.txt
          OMP_NUM_THREADS=2 python scripts/models/prepare_models.py
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          if [ '${{ inputs.include_models }}' = 'true' ]; then
            ./gradlew :pixel:testDebugUnitTest :pixel:lintDebug :pixel:assembleDebug
          else
            ./gradlew -PallowMissingModels=true :pixel:testDebugUnitTest :pixel:lintDebug :pixel:assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Pixel10-PicQuery-${{ inputs.include_models && 'research-with-models' || 'UI-OCR-only-no-visual-models' }}
          path: pixel/build/outputs/apk/debug/*.apk
